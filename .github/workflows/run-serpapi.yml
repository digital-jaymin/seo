name: Run SERP Fetch (Serper.dev)

# Manual trigger only — never runs automatically.
# Use this when the Claude cloud environment cannot reach Serper.dev directly.
"on":
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Keyword to fetch SERP for (e.g. hp laptop service center ahmedabad)'
        required: true
        type: string
      slug:
        description: 'Blog folder slug (e.g. hp-laptop-service-center-ahmedabad)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-serp:
    name: Fetch SERP and commit results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/setup-connection-e8W80
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Fetch SERP data via Serper.dev
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python scripts/serper_fetcher.py \
            --keyword "${{ github.event.inputs.keyword }}" \
            --country in

      - name: Verify serp-analysis.json was created
        run: |
          OUTPUT="blogs/drafts/${{ github.event.inputs.slug }}/serp-analysis.json"
          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: $OUTPUT was not created. Check the step above for errors."
            exit 1
          fi
          echo "SUCCESS: $OUTPUT created."
          python -c "
          import json
          with open('$OUTPUT') as f:
              d = json.load(f)
          print('Data source    :', d.get('data_source'))
          print('Organic results:', len(d.get('top_10_results', [])))
          print('PAA questions  :', len(d.get('people_also_ask', [])))
          print('Related searches:', len(d.get('related_searches', [])))
          "

      - name: Update workflow-state.json
        run: |
          python - <<'PYEOF'
          import json, datetime

          state_path = "workflows/workflow-state.json"
          with open(state_path) as f:
              state = json.load(f)

          state["current_state"]["status"] = "waiting_for_next_step"
          state["current_state"]["current_stage"] = "serp_analysis"
          state["current_state"]["last_completed_stage"] = "serp_analysis"
          state["current_state"]["next_action"] = "create_blueprint"
          state["_meta"]["last_updated"] = datetime.date.today().isoformat()
          state["pending_inputs"] = [
              p for p in state.get("pending_inputs", [])
              if p.get("input_id") != "SERP-001"
          ]

          with open(state_path, "w") as f:
              json.dump(state, f, indent=2)

          print("workflow-state.json updated — next: create_blueprint")
          PYEOF

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "blogs/drafts/${{ github.event.inputs.slug }}/serp-analysis.json"
          git add workflows/workflow-state.json

          if git diff --cached --quiet; then
            echo "No changes to commit — already up to date."
          else
            git commit -m "feat: SERP analysis for '${{ github.event.inputs.keyword }}' via Serper.dev"
            git push origin claude/setup-connection-e8W80
            echo "Pushed successfully."
          fi
